<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FinSecure Bank — Angular Demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Inter, matching the React apps. preconnect first so the handshake to the font host overlaps
         HTML parsing; display=swap so text paints immediately in the fallback rather than staying
         invisible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

</html>
