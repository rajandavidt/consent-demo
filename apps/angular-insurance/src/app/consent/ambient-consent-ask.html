@if (pending(); as state) {
  <div
    class="akku-surface akku-surface--snackbar"
    role="status"
    [attr.aria-label]="state.name"
    [attr.data-source]="source()"
  >
    <div class="akku-snackbar__text">
      <div class="akku-row__head">
        <span class="akku-row__name">{{ state.name }}</span>
        <akku-legal-basis-pill [basis]="state.legalBasis" />
      </div>
      @if (state.description) {
        <p class="akku-row__desc">{{ state.description }}</p>
      }
    </div>
    <div class="akku-snackbar__actions">
      <button
        type="button"
        class="akku-btn akku-btn--decline"
        [disabled]="busy()"
        (click)="answer(false)"
      >
        No thanks
      </button>
      <button
        type="button"
        class="akku-btn akku-btn--accept"
        [disabled]="busy()"
        (click)="answer(true)"
      >
        Allow
      </button>
      <!-- "Later" writes nothing at all. It is not a third answer; it is the absence of one. -->
      <button
        type="button"
        class="akku-btn akku-btn--quiet"
        [disabled]="busy()"
        (click)="later()"
      >
        Later
      </button>
    </div>
  </div>
}
